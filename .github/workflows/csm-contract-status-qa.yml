name: CSM contract status QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'migration_2026-10-14_csm_contract_status_and_unify.sql'
      - 'tests/csm-contract-status.pg.sql'
      - '.github/workflows/csm-contract-status-qa.yml'
  workflow_dispatch:
jobs:
  csm-contract-sql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contract_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: contract_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Contract state and identity integration
        run: psql -v ON_ERROR_STOP=1 -f tests/csm-contract-status.pg.sql
      - name: Check CSM inline JS syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)
          for i,code in enumerate(scripts):
              if code.strip():
                  Path('/tmp/csm-script-'+str(i)+'.js').write_text(code)
                  subprocess.run(['node','--check','/tmp/csm-script-'+str(i)+'.js'],check=True)
          print('CSM JavaScript syntax OK')
          PY

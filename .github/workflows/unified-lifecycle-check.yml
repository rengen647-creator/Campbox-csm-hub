name: Unified lifecycle checks
on:
  push:
    branches:
      - feature/unified-lifecycle-2026-10-30
  pull_request:
    paths:
      - 'implementation/unified-lifecycle/**'
      - '.github/workflows/unified-lifecycle-check.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test implementation/unified-lifecycle/*.test.js
